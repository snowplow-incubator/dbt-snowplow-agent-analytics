name: 'snowplow_agent_analytics'
version: '0.1.0'
config-version: 2

require-dbt-version: [">=1.10.6", "<2.0.0"]

profile: 'default'

dispatch:
  - macro_namespace: dbt
    search_order: ['snowplow_utils', 'dbt']

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  snowplow_agent_analytics:
    +schema: "snowplow_agent_analytics"
    staging:
      +materialized: table
    marts:
      +materialized: incremental

seeds:
  snowplow_agent_analytics:
    +schema: "snowplow_agent_analytics"
    operator_referral_sources:
      +column_types:
        operator: varchar
        source_value: varchar
        medium_value: varchar

vars:
  snowplow_agent_analytics:
    # source table and event subsetting
    snowplow__atomic_schema: 'atomic'   # schema holding the Snowplow events table
    snowplow__events_table: 'events'    # name of the Snowplow events table
    # snowplow__database:               # only set if not using target.database
    cdn_app_ids: ['cdn']                # app_id values identifying CDN/edge events

    # incremental manifest (safe incremental processing)
    snowplow__start_date: '2024-01-01'  # earliest date to process on first run
    snowplow__backfill_limit_days: 30   # max days processed per run during backfill
    snowplow__allow_refresh: false      # allow --full-refresh to drop the incremental manifest
    snowplow__dev_target_name: dev      # target name treated as dev (refresh always allowed)

    # late-data window (shared by all daily tables)
    late_data_window_days: 3
    dbt_start_date: '2024-01-01'

    # snapshot behavior for summary tables
    summary_snapshot_mode: 'weekly'     # latest | weekly | daily
    summary_snapshot_retention_weeks: 26

    # AEO indicator thresholds
    orphan_agent_hits_threshold: 10
    orphan_human_pageviews_threshold: 5

on-run-start:
  - "{{ snowplow_utils.snowplow_delete_from_manifest(var('models_to_remove', []), ref('incremental_manifest')) }}"

on-run-end:
  - "{{ snowplow_utils.snowplow_incremental_post_hook_t(package_name='snowplow_agent_analytics', incremental_manifest_table_name='incremental_manifest', base_events_this_run_table_name='base_events_this_run') }}"

flags:
  require_generic_test_arguments_property: true
