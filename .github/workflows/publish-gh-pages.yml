name: generate-docs-pages

# Builds the integration test project against Snowflake so the catalog carries real column
# types, generates the dbt docs site, and force-pushes it to the gh_pages branch under docs/.
# GitHub Pages should be configured to serve from gh_pages, folder /docs.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: dbt_docs_pages

env:
  # Set profiles.yml directory
  DBT_PROFILES_DIR: ./ci

  # Own schema suffix so this never collides with a local or PR integration test run
  SCHEMA_SUFFIX: gh_pages

  # Snowflake Connection
  SNOWFLAKE_TEST_ACCOUNT: ${{ secrets.SNOWFLAKE_TEST_ACCOUNT }}
  SNOWFLAKE_TEST_USER: ${{ secrets.SNOWFLAKE_TEST_USER }}
  SNOWFLAKE_TEST_PASSWORD: ${{ secrets.SNOWFLAKE_TEST_PASSWORD }}
  SNOWFLAKE_TEST_ROLE: ${{ secrets.SNOWFLAKE_TEST_ROLE }}
  SNOWFLAKE_TEST_DATABASE: ${{ secrets.SNOWFLAKE_TEST_DATABASE }}
  SNOWFLAKE_TEST_WAREHOUSE: ${{ secrets.SNOWFLAKE_TEST_WAREHOUSE }}

jobs:
  gh_pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        # Build from the integration_tests sub dir, which seeds the fixture as the source
        working-directory: ./integration_tests
    strategy:
      matrix:
        dbt_version: ["1.*"]
        warehouse: ["snowflake"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # otherwise, you will failed to push refs to dest repo

    - name: Set DEFAULT_TARGET env
      run: |
        echo "DEFAULT_TARGET=${{ matrix.warehouse }}" >> $GITHUB_ENV

    - name: Install jq
      run: sudo apt-get update && sudo apt-get install jq

    - name: Python setup
      uses: actions/setup-python@v5
      with:
        python-version: "3.12.x"

    - name: Pip cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.dbt_version }}-${{ matrix.warehouse }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.dbt_version }}-${{ matrix.warehouse }}

    # Install latest patch version. Upgrade if cache contains old patch version.
    - name: Install dependencies
      run: |
        pip install pip wheel setuptools
        pip install dbt-${{ matrix.warehouse }}==${{ matrix.dbt_version }} --upgrade
        dbt deps

    # A single run with the backfill limit raised past the fixture's 100-day span builds
    # every model; the catalog only needs the tables to exist, not the incremental sequence.
    - name: Create dbt docs
      run: |
        dbt run-operation post_ci_cleanup --target ${{ matrix.warehouse }}
        dbt seed --target ${{ matrix.warehouse }} --full-refresh
        # The stg model is read through source(), not ref(), so dbt can't order it -- build it first
        dbt run --target ${{ matrix.warehouse }} --select snowplow_agent_analytics_events_stg
        dbt run --target ${{ matrix.warehouse }} --full-refresh --exclude snowplow_agent_analytics_events_stg --vars '{snowplow__backfill_limit_days: 120}'
        dbt docs generate --target ${{ matrix.warehouse }} --vars '{snowplow__backfill_limit_days: 120}'
        mkdir -p ../docs
        rm -f ../docs/catalog.json ../docs/manifest.json ../docs/run_results.json ../docs/index.html
        # Drop the integration test project's own nodes (fixture seeds, *_actual/*_expected
        # models, equality tests) so the site documents only the package.
        jq 'walk(if type == "object" then with_entries(select(.key | contains("snowplow_agent_analytics_integration_tests") | not)) else . end)' target/manifest.json > target/new_manifest.json
        jq 'walk(if type == "object" then with_entries(select(.key | contains("snowplow_agent_analytics_integration_tests") | not)) else . end)' target/catalog.json > target/new_catalog.json
        cp target/new_catalog.json ../docs/catalog.json
        cp target/new_manifest.json ../docs/manifest.json
        cp target/run_results.json ../docs/run_results.json
        cp target/index.html ../docs/index.html

    - name: Cleanup
      if: always()
      run: dbt run-operation post_ci_cleanup --target ${{ matrix.warehouse }}

    - name: Commit & Push changes
      uses: EndBug/add-and-commit@v9
      with:
        add: ./docs/catalog.json ./docs/manifest.json ./docs/run_results.json ./docs/index.html
        default_author: github_actions
        message: 'Update dbt docs'
        new_branch: gh_pages
        push: 'origin gh_pages --force'
